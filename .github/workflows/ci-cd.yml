# =============================================================================
#  CI/CD - La 501 Sports Web (Laravel)
#
#  - Pruebas:   cada push o Pull Request hacia develop, release o main
#               ejecuta las pruebas unitarias (tests/Unit) y de integración
#               (tests/Feature) contra una base de datos MySQL de pruebas.
#  - Versión:   en los Pull Request hacia main verifica que la versión la haya
#               preparado release-please (existe su tag) y que sea nueva para main.
#  - Construir: en cada push a release o main genera el paquete de producción
#               optimizado (.zip listo para subir a Hostinger).
#  - Publicar:  en cada push a main adjunta el .zip al Release vX.Y.Z que creó
#               release-please.
#  - Desplegar: después de publicar, sube el paquete a Hostinger por SSH
#               (respaldo, mantenimiento, archivos, migraciones y verificación).
#  - Sincronizar: abre el PR release → develop para que develop tenga la versión.
#
#  El número de versión, el CHANGELOG y el tag los maneja release-please
#  (.github/workflows/release-please.yml).
# =============================================================================
name: CI/CD

on:
  push:
    branches: [develop, release, main]
  pull_request:
    branches: [develop, release, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Solo se cancelan ejecuciones viejas de los Pull Request, nunca una publicación.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'
  PHP_EXTENSIONS: mbstring, dom, fileinfo, pdo_mysql, bcmath, intl, gd, zip, exif

jobs:
  # ---------------------------------------------------------------------------
  # 1. Detecta si el proyecto Laravel ya está en el repositorio y lee la versión
  # ---------------------------------------------------------------------------
  verificar:
    name: Verificar proyecto
    runs-on: ubuntu-latest
    outputs:
      laravel: ${{ steps.revisar.outputs.laravel }}
      node: ${{ steps.revisar.outputs.node }}
      version: ${{ steps.revisar.outputs.version }}
    steps:
      - name: Descargar código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Revisar estructura y versión
        id: revisar
        run: |
          if [ -f artisan ] && [ -f composer.json ]; then
            echo "laravel=true" >> "$GITHUB_OUTPUT"
          else
            echo "laravel=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Proyecto pendiente::Todavía no se encuentra el proyecto Laravel (artisan y composer.json). Se omiten pruebas y compilación."
          fi

          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

          VERSION="$(tr -d ' \r\n' < VERSION 2>/dev/null || true)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::El archivo VERSION debe contener un número de versión con formato X.Y.Z (ej. 1.0.0). Valor actual: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión del proyecto: $VERSION"

  # ---------------------------------------------------------------------------
  # 2. En los Pull Request hacia main: la versión la preparó release-please y es
  #    nueva para main (evita llegar a main sin versión o repetir una ya publicada)
  # ---------------------------------------------------------------------------
  version:
    name: Versión
    needs: verificar
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Comprobar la versión
        env:
          VERSION: ${{ needs.verificar.outputs.version }}
        run: |
          git fetch --quiet --depth=1 origin main
          EN_MAIN="$(git show origin/main:VERSION 2>/dev/null | tr -d ' \r\n' || true)"
          if [ "$VERSION" = "$EN_MAIN" ]; then
            echo "::error file=VERSION::main ya tiene la versión ${VERSION}. Fusiona primero en release el PR de release-please (\"chore: preparar versión …\")."
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error file=VERSION::No existe el tag v${VERSION}: esta versión no la preparó release-please. Fusiona su PR en release y vuelve a intentarlo."
            exit 1
          fi
          echo "Versión v${VERSION} preparada por release-please (main tiene ${EN_MAIN:-ninguna})."

  # ---------------------------------------------------------------------------
  # 3. Pruebas unitarias y de integración
  # ---------------------------------------------------------------------------
  pruebas:
    name: Pruebas
    needs: verificar
    if: needs.verificar.outputs.laravel == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: la501_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: la501_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: array
      CACHE_STORE: array
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: log
      BROADCAST_DRIVER: log

    steps:
      - name: Descargar código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Instalar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        if: needs.verificar.outputs.node == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compilar recursos (Vite)
        if: needs.verificar.outputs.node == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then npm run build; fi

      - name: Preparar entorno (.env y APP_KEY)
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else echo "APP_NAME=La501Sports" > .env; fi
          php artisan key:generate --force
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs bootstrap/cache

      - name: Preparar base de datos de pruebas
        run: php artisan migrate --force

      - name: Ejecutar pruebas unitarias y de integración
        run: |
          if [ ! -d tests ]; then
            echo "::error title=Sin pruebas::No existe la carpeta tests/. Agrega pruebas en tests/Unit y tests/Feature."
            exit 1
          fi
          php artisan test

  # ---------------------------------------------------------------------------
  # 4. Paquete de producción optimizado (release y main)
  # ---------------------------------------------------------------------------
  construir:
    name: Construir versión de producción
    needs: [verificar, pruebas]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main') &&
      needs.verificar.outputs.laravel == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
    steps:
      - name: Descargar código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Instalar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Instalar dependencias de producción (optimizado)
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        if: needs.verificar.outputs.node == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compilar recursos para producción (Vite)
        if: needs.verificar.outputs.node == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then npm run build; fi

      - name: Armar paquete .zip
        id: paquete
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            NOMBRE="la501-sports-web-v${VERSION}"
          else
            NOMBRE="la501-sports-web-v${VERSION}-rc"
          fi

          mkdir -p dist
          rsync -a ./ "dist/${NOMBRE}/" \
            --exclude '.git' --exclude '.github' --exclude 'dist' \
            --exclude 'node_modules' --exclude 'tests' \
            --exclude '.env' --exclude '.env.backup' --exclude '.env.production' \
            --exclude 'phpunit.xml' --exclude '.phpunit.result.cache' \
            --exclude 'storage/logs/*.log' \
            --exclude 'storage/framework/cache/data/*' \
            --exclude 'storage/framework/sessions/*' \
            --exclude 'storage/framework/views/*.php'

          {
            echo "Proyecto: La 501 Sports Web"
            echo "Version:  ${VERSION}"
            echo "Rama:     ${GITHUB_REF_NAME}"
            echo "Commit:   ${GITHUB_SHA}"
            echo "Fecha:    $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > "dist/${NOMBRE}/BUILD_INFO.txt"

          (cd dist && zip -qr "${NOMBRE}.zip" "${NOMBRE}")
          echo "nombre=${NOMBRE}" >> "$GITHUB_OUTPUT"
          ls -lh dist/*.zip

      - name: Guardar paquete como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.paquete.outputs.nombre }}
          path: dist/${{ steps.paquete.outputs.nombre }}.zip
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. Adjuntar el paquete al Release que creó release-please (solo main)
  # ---------------------------------------------------------------------------
  publicar:
    name: Publicar versión estable
    needs: [verificar, construir]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Descargar paquete de producción
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: la501-sports-web-v${{ needs.verificar.outputs.version }}
          path: dist

      - name: Adjuntar paquete al Release v${{ needs.verificar.outputs.version }}
        run: |
          ARCHIVO="dist/la501-sports-web-v${VERSION}.zip"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ARCHIVO" --clobber
          else
            # Respaldo por si se llegó a main sin release-please: se crea el Release aquí.
            echo "::warning::No existe el Release v${VERSION} de release-please; se crea desde main."
            gh release create "v${VERSION}" "$ARCHIVO" --target "${GITHUB_SHA}" \
              --title "La 501 Sports Web v${VERSION}" --generate-notes
          fi

  # ---------------------------------------------------------------------------
  # 6. Despliegue en Hostinger (solo main, después de publicar)
  #
  #    Nunca borra archivos del servidor (sin --delete): .env, storage/, avatares
  #    y lo que solo existe allá se conservan. Antes respalda código y BD.
  #    Requiere los secretos HOSTINGER_SSH_* y HOSTINGER_APP_PATH (README, sección 5).
  # ---------------------------------------------------------------------------
  desplegar:
    name: Desplegar en Hostinger
    needs: [verificar, construir, publicar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://lavender-ram-537394.hostingersite.com
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
      SITIO: https://lavender-ram-537394.hostingersite.com
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
    steps:
      - name: Revisar credenciales de Hostinger
        id: credenciales
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ] || [ -z "$APP_PATH" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Despliegue omitido::Faltan los secretos HOSTINGER_SSH_HOST, HOSTINGER_SSH_USER, HOSTINGER_SSH_KEY o HOSTINGER_APP_PATH. Sube el .zip del Release a mano o agrega los secretos."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar código (scripts de despliegue)
        if: steps.credenciales.outputs.listo == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Descargar paquete de producción
        if: steps.credenciales.outputs.listo == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: la501-sports-web-v${{ needs.verificar.outputs.version }}
          path: dist

      - name: Preparar conexión SSH
        if: steps.credenciales.outputs.listo == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger && chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2> /dev/null
          {
            echo "Host hostinger"
            echo "  HostName $SSH_HOST"
            echo "  Port ${SSH_PORT:-22}"
            echo "  User $SSH_USER"
            echo "  IdentityFile ~/.ssh/hostinger"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          unzip -q "dist/la501-sports-web-v${VERSION}.zip" -d dist

      - name: Respaldar y activar mantenimiento
        if: steps.credenciales.outputs.listo == 'true'
        run: ssh hostinger 'bash -s' -- "$APP_PATH" "$VERSION" < scripts/deploy/antes.sh

      - name: Subir archivos
        if: steps.credenciales.outputs.listo == 'true'
        run: |
          rsync -rlz --checksum --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'storage/' --exclude 'public/storage' --exclude 'public/avatars/' \
            "dist/la501-sports-web-v${VERSION}/" "hostinger:${APP_PATH}/"

      - name: Migraciones y caché
        if: steps.credenciales.outputs.listo == 'true'
        run: ssh hostinger 'bash -s' -- "$APP_PATH" "$VERSION" < scripts/deploy/despues.sh

      - name: Si algo falló, sacar el sitio de mantenimiento
        if: failure() && steps.credenciales.outputs.listo == 'true'
        run: ssh hostinger "cd '$APP_PATH' && php artisan up" || true

      - name: Verificar el sitio en producción
        if: steps.credenciales.outputs.listo == 'true'
        run: |
          revisar() {
            local esperado="$1" ruta="$2" codigo
            codigo="$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: application/json' "$SITIO$ruta")"
            if [ "$codigo" != "$esperado" ]; then
              echo "::error title=Verificación fallida::$ruta respondió $codigo (se esperaba $esperado). Revisa storage/logs/laravel.log en el servidor."
              return 1
            fi
            echo "OK $codigo $ruta"
          }
          revisar 200 /up
          revisar 200 '/api/v1/public/products?limit=1'
          # Sin token debe pedir sesión: confirma que la ruta y sus middlewares cargan (un 500 indicaría un despliegue incompleto).
          revisar 401 /api/v1/app/waiter/tables
          revisar 401 /api/v1/app/admin/sales/summary

  # ---------------------------------------------------------------------------
  # 7. Sincronizar develop con la versión publicada (solo main)
  # ---------------------------------------------------------------------------
  sincronizar:
    name: Sincronizar develop
    needs: [verificar, publicar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Abrir PR release → develop
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Sincronización pendiente::Falta el secreto RELEASE_TOKEN. Abre a mano el PR release → develop."
            exit 0
          fi
          REPO="${GITHUB_REPOSITORY}"
          PENDIENTES="$(gh api "repos/$REPO/compare/develop...release" --jq '.ahead_by')"
          if [ "${PENDIENTES:-0}" = "0" ]; then
            echo "develop ya tiene todo lo de release."
            exit 0
          fi
          if [ -n "$(gh pr list -R "$REPO" --base develop --head release --state open --json number --jq '.[0].number')" ]; then
            echo "Ya hay un PR release → develop abierto."
            exit 0
          fi
          gh pr create -R "$REPO" --base develop --head release \
            --title "chore: sincronizar develop con la versión ${VERSION} (release → develop)" \
            --body "Sincronización automática después de publicar v${VERSION}: trae a develop el ajuste de versión y el CHANGELOG."
